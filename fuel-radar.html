<meta name="theme-color" content="#0E1A1F">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuel Radar">

<title>Fuel Radar — live pump prices around you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=Chivo+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>:root{
  --ink:#0E1A1F;--panel:#15262E;--panel2:#1C333D;--line:#24414C;
  --text:#EDF4F2;--muted:#8FA6AE;--amber:#FFB627;--teal:#2EC4B6;--danger:#F2635F;
  --mono:'Chivo Mono',ui-monospace,monospace;--disp:'Saira Condensed',sans-serif;--body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(1200px 500px at 50% -10%, #16303B 0%, transparent 60%)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 70px}
a{color:var(--teal)} :focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:2px}
.muted{color:var(--muted)}
header{display:flex;align-items:baseline;gap:14px;padding:24px 0 6px;flex-wrap:wrap}
.logo{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:.5px;text-transform:uppercase}
.logo span{color:var(--amber)}
.tag{color:var(--muted);font-size:13px}
#status{font-size:12px;color:var(--muted);margin:6px 0 0;min-height:16px}
#status.err{color:var(--danger)} #status.ok{color:var(--teal)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.controls{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.locrow{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],select{background:#0B161B;border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;font-size:14px;padding:9px 11px}
input[type=text]{flex:1;min-width:180px}
input::placeholder{color:#4E6772}
input:focus,select:focus{border-color:var(--teal);outline:none}
.btn{background:var(--amber);color:#1A1302;border:0;border-radius:9px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
.btn:disabled{opacity:.55;cursor:wait}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chips .lab{font-size:12px;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);background:#0B161B;color:var(--muted);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.chip:hover{color:var(--text)}
.sortrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.sortrow input{width:64px;background:#0B161B;border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;font-size:13px;padding:6px 8px}
.sortrow select{width:auto;padding:6px 10px;font-size:13px}
.pick{margin-top:14px;border:1px solid var(--teal);background:linear-gradient(180deg,rgba(46,196,182,.10),rgba(46,196,182,.03));border-radius:14px;padding:14px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pick[hidden]{display:none}
.pick .plabel{font-family:var(--disp);font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--teal)}
.pick .pprice{font-family:var(--mono);font-weight:700;font-size:30px;color:var(--teal)}
.pick .pinfo{flex:1;min-width:200px}
.pick .pname{font-weight:600}
.pick .paddr{font-size:12px;color:var(--muted)}
.split{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:14px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
#map{height:420px;border-radius:14px;border:1px solid var(--line);z-index:0}
#list{display:flex;flex-direction:column;gap:10px;max-height:560px;overflow:auto;padding-right:4px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.st.best{border-color:var(--teal)}
.rank{font-family:var(--mono);font-weight:700;color:var(--muted);width:26px;text-align:center;flex-shrink:0}
.st .mid{flex:1;min-width:0}
.st .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .addr{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.st .meta .d{color:var(--text)}
.st .meta .gline{font-weight:700;color:var(--teal)}
.st .meta .sav{font-weight:700}
/* bigger chip for the flagship brands */
.logo-img,.logo-fb{width:44px;height:32px;object-fit:contain;background:#fff;border-radius:9px;padding:3px;flex-shrink:0}
.logo-fb{background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:12px;color:var(--amber);overflow:hidden}
.logo-img.big,.logo-fb.big{width:52px;height:38px;border-radius:11px;padding:4px}
.logo-fb.big{font-size:13px}
.st .meta .sav.cheap{color:var(--teal)}
.st .meta .sav:not(.cheap){color:var(--amber)}
.st .right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.st .price{font-family:var(--mono);font-weight:700;font-size:20px}
.st .price.cheap{color:var(--teal)} .st .price.dear{color:var(--danger)}
.st .net{font-size:15px;font-family:var(--mono);color:var(--muted);cursor:help}
.st .go{font-size:11px;text-decoration:none;color:var(--muted)}
.st .go:hover{color:var(--teal)}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.empty b{color:var(--text)}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--amber);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.leaflet-container{background:#0B161B;font-family:var(--body)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.leaflet-popup-content{margin:10px 14px}
.leaflet-control-attribution{background:rgba(14,26,31,.85)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--teal)!important}
.pin{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);font-family:var(--mono);font-weight:700;font-size:11px;color:#0E1A1F;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.pin b{transform:rotate(45deg)}

.langs{margin-left:auto;display:flex;gap:6px}
.lchip{font-weight:700;letter-spacing:.05em;padding:5px 11px}
/* mobile app layout */
@media (max-width:640px){
  .wrap{padding:0 12px 60px}
  header{padding-top:16px;gap:10px}
  .logo{font-size:26px}
  .locrow{flex-direction:column}
  .locrow .btn{width:100%;padding:13px 16px;font-size:15px}
  input[type=text],select{font-size:16px}   /* prevents iOS zoom */
  input[type=text]{min-width:0;width:100%}
  #map{height:52vh;min-height:300px}
  #list{max-height:none}
  .st{padding:13px 11px}
  .st .price{font-size:22px}
  .pick{flex-direction:column;align-items:flex-start;gap:8px}
  .sortrow{font-size:13px}
  .sortrow input{width:60px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">Fuel<span>·</span>Radar</div>
  <div class="tag" id="tag">live pump prices around you — Belgium &amp; borders</div>
  <nav class="langs" aria-label="Language / Taal / Langue">
    <button class="chip lchip" data-l="en" aria-pressed="false">EN</button>
    <button class="chip lchip" data-l="fr" aria-pressed="false">FR</button>
    <button class="chip lchip" data-l="nl" aria-pressed="false">NL</button>
  </nav>
</header>
<p id="status" role="status" aria-live="polite"></p>

<div class="card controls">
  <div class="locrow">
    <button class="btn" id="btnGeo" type="button">◎ Locate me</button>
    <input type="text" id="q" placeholder="or type a place — e.g. Leuven, Namur, Antwerpen…" aria-label="Search a place">
    <button class="btn ghost" id="btnGo" type="button">Search</button>
  </div>
  <div class="chips" id="fuelChips"><span class="lab">Fuel</span></div>
  <div class="chips" id="radChips"><span class="lab">Radius</span></div>
  <div class="chips" id="brandRow"><span class="lab">Brand</span><select id="brandSel" aria-label="Filter by brand"><option value="">All brands</option></select></div>
  <div class="sortrow">
    Sort
    <select id="sortBy" aria-label="Sort stations">
      <option value="smart">Smart — price + detour cost</option>
      <option value="price">Cheapest first</option>
      <option value="dist">Nearest first</option>
    </select>
    <label style="display:flex;gap:4px;align-items:center">car uses <input id="cons" type="number" min="1" step="0.1" value="6.5"> L/100 km</label>
    <label style="display:flex;gap:4px;align-items:center">fills <input id="fill" type="number" min="5" step="1" value="40"> L</label>
    <span id="netnote" title="net = fill + fuel to get there">net = fill + fuel to get there</span>
  </div>
</div>

<div class="pick" id="pick" hidden></div>

<div class="split">
  <div id="map" aria-label="Map of nearby stations"></div>
  <div id="list"></div>
</div>

<footer>
  <span id="f1"></span>
  <span id="f2"></span>
</footer>
<p id="installHint" style="text-align:center;color:var(--muted);font-size:12px;margin:10px 0 0"></p>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

const subst=(o,m)=>{let x=o;for(const[k,v]of Object.entries(m))x=x.split("{"+k+"}").join(v);return x;};
const loc=()=>lang==="fr"?"fr-BE":lang==="nl"?"nl-BE":"en-GB";
const nf3=v=>v.toLocaleString(loc(),{minimumFractionDigits:3,maximumFractionDigits:3});
const nf2=v=>v.toLocaleString(loc(),{minimumFractionDigits:2,maximumFractionDigits:2});
const money=v=>lang==="en"?"€"+nf2(v):nf2(v)+" €";
const fuelName=id=>id==="DIESEL_SPECIAL"?t("premium"):id==="EURO95"?"Euro 95":id==="EURO98"?"Super 98":id==="DIESEL"?"Diesel":id==="AUTOGAS"?"LPG":"CNG";

const ROAD=1.3; // straight-line km -> realistic road km
let center=null, radius=10, fuel="EURO95", sortBy="smart", brand="", stations=[], markers=[], map=null, busying=false;

/* ---------- transport: direct first, then CORS relays ---------- */
const PROXIES=[
  u=>u,
  u=>"https://r.jina.ai/"+u,
  u=>"https://test.cors.workers.dev/?c=https://"+u.replace(/^https?:\/\//,""),
  u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
  u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u),
  u=>"https://api.cors.lol/?url="+encodeURIComponent(u)
];
async function getJSON(url){
  let lastErr;
  for(let i=0;i<PROXIES.length;i++){
    try{
      const ac=new AbortController();const to=setTimeout(()=>ac.abort(),i===0?15000:i===1?40000:25000);
      const r=await fetch(PROXIES[i](url),{signal:ac.signal});
      clearTimeout(to);
      if(!r.ok)throw new Error("HTTP "+r.status);
      const txt=await r.text();
      const j=JSON.parse(txt.slice(txt.indexOf("{")));
      if(!j.value)throw new Error("unexpected payload");
      return {data:j,via:i};
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error("all routes failed");
}

/* ---------- data ---------- */
function bbox(lat,lon,km){
  const dLat=km/111, dLon=km/(111*Math.cos(lat*Math.PI/180));
  return `${(lat-dLat).toFixed(4)},${(lon-dLon).toFixed(4)},${(lat+dLat).toFixed(4)},${(lon+dLon).toFixed(4)}`;
}
function hav(a,b,c,d2){const R=6371,rad=Math.PI/180,dl=(c-a)*rad,dl2=(d2-b)*rad;
  const h=Math.sin(dl/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(dl2/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function parse(j){
  return (j.value||[]).filter(s=>s.coordinates&&s.coordinates.latitude&&s.prices&&s.prices.length)
    .map(s=>({id:s.id,name:s.title||"Station",lat:s.coordinates.latitude,lon:s.coordinates.longitude,
      addr:[s.address?.streetAddress,s.address?.postalCode,s.address?.city].filter(Boolean).join(", "),
      prices:Object.fromEntries(s.prices.filter(p=>p.currency==="EUR"&&typeof p.value==="number").map(p=>[p.fuelType,p.value]))}));
}
function setStatus(msg,cls){const el=$("#status");el.className=cls||"";el.innerHTML=msg;}

async function load(){
  if(!center||busying)return;
  busying=true;$("#btnGeo").disabled=true;
  setStatus('<span class="spin"></span>'+t("fetching").replace("{r}",radius));
  try{
    const {data,via}=await getJSON(API+"&bounding-box-filter="+bbox(center.lat,center.lon,radius));
    stations=parse(data).map(s=>({...s,dist:hav(center.lat,center.lon,s.lat,s.lon)}))
      .filter(s=>s.dist<=radius*1.05);
    updateBrands();
    localStorage.setItem("fuelradar.cache",JSON.stringify({ts:Date.now(),center,stations}));
    const names=["direct","jina relay","cors.workers.dev","allorigins","codetabs","cors.lol"];
    setStatus(subst(t("ok"),{n:stations.length,via:names[via],date:new Date().toLocaleTimeString(loc())}),"ok");
    render();fetchRoad();
  }catch(e){
    const c=JSON.parse(localStorage.getItem("fuelradar.cache")||"null");
    if(c&&c.stations.length){stations=c.stations;updateBrands();render();
      setStatus(subst(t("cachewarn"),{date:new Date(c.ts).toLocaleString(loc())}),"err");
    }else setStatus(t("fail"),"err");
  }
  busying=false;$("#btnGeo").disabled=false;
}

/* ---------- real road distances (OSRM) ---------- */
const roadKm=s=>s.roadd??s.dist*ROAD;
async function fetchRoad(){
  if(!center)return;
  const cand=stations.slice().sort((a,b)=>a.dist-b.dist).slice(0,60);
  if(cand.length<2)return;
  const coords=[center.lon+","+center.lat].concat(cand.map(s=>s.lon+","+s.lat)).join(";");
  try{
    const r=await fetch("https://router.project-osrm.org/table/v1/driving/"+coords+"?annotations=distance&sources=0",{signal:AbortSignal.timeout(20000)});
    const j=await r.json();
    if(j.code!=="Ok"||!j.distances)throw new Error("osrm "+j.code);
    cand.forEach((st,i)=>{const m=j.distances[0][i+1];if(m!=null)st.roadd=m/1000;});
    localStorage.setItem("fuelradar.cache",JSON.stringify({ts:Date.now(),center,stations}));
    setStatus(t("roaddone"),"ok");render();autoCheck();
  }catch(e){/* keep 1.3 x estimates */}
}

/* ---------- scoring ---------- */
function score(s){
  const p=s.prices[fuel];if(p==null)return Infinity;
  if(sortBy==="price")return p;
  if(sortBy==="dist")return s.dist;
  const cons=+$("#cons").value||6.5, fl=+$("#fill").value||40;
  const detourCost=2*roadKm(s)*cons/100*p;
  return p+detourCost/fl;
}

/* ---------- Google price check (on demand) ---------- */
const GKEY="AIzaSyB5b1vi5Miv4bXn-1C38Gu0EI5NYIpCSUY";
const GTYPES={EURO95:"SP95_E10",EURO98:"SP98",DIESEL:"DIESEL",AUTOGAS:"LPG",CNG:"CNG"};
let gcheck=JSON.parse(localStorage.getItem("fuelradar.gchk")||"{}");
function gQuota(){
  const d=new Date().toISOString().slice(0,10);
  const c=JSON.parse(localStorage.getItem("fuelradar.gcq.v2")||'{"d":"","n":0}');
  if(c.d!==d){c.d=d;c.n=0}
  return c;
}
async function gVerify(s){
  const c=gQuota();
  if(c.n>=100){setStatus(t("gday"),"err");return;}
  const want=GTYPES[fuel];
  if(!want)return;
  const parts=(s.addr||"").split(",").map(x=>x.trim()).filter(Boolean);
  const city=parts.length?parts[parts.length-1]:"";
  const street=parts.length?parts[0]:s.name;
  const streetNN=street.replace(/\s*\d+\s*[a-zA-Z]?\/?\s*$/,"").trim()||street;
  const queries=[s.name+" "+city, s.name+" "+streetNN+" "+city];
  c.n++;localStorage.setItem("fuelradar.gcq",JSON.stringify(c));
  setStatus('<span class="spin"></span>'+esc(t("gwork")));
  try{
    const is95=want.indexOf("95")>=0,is98=want.indexOf("98")>=0;
    function score(type){
      const u=(type||"").toUpperCase();
      if(u===want)return 3;
      if(is95&&u.indexOf("95")>=0)return 2;
      if(is98&&u.indexOf("98")>=0)return 2;
      if(want==="DIESEL")return u==="DIESEL"?3:(u.indexOf("DIESEL")>=0?1:0);
      if(want==="AUTOGAS")return (u==="LPG"||u==="AUTOGAS")?2:0;
      if(want==="CNG")return (u.indexOf("CNG")>=0||u.indexOf("GNC")>=0)?2:0;
      return 0;
    }
    let hit=null,src=null;
    for(const q of queries){
      const sr=await fetch("https://places.googleapis.com/v1/places:searchText",{method:"POST",
        headers:{"Content-Type":"application/json","X-Goog-Api-Key":GKEY,
          "X-Goog-FieldMask":"places.id,places.displayName,places.fuelOptions"},
        body:JSON.stringify({textQuery:q,"languageCode":"fr"})});
      const sj=await sr.json();
      for(const p of (sj.places||[]).slice(0,3)){
        for(const f of ((p.fuelOptions||{}).fuelPrices||[])){
          const sc=score(f.type);
          if(sc>(hit?hit._sc:0)){hit=Object.assign({},f,{_sc:sc});src=p;}
        }
      }
      if(hit&&hit._sc>=2)break;
    }
    if(!hit){setStatus(t("gnoprice"),"err");return;}
    const val=(+hit.price.units||0)+(+hit.price.nanos||0)/1e9;
    gcheck[s.id]={v:val,ts:hit.updateTime,f:fuel,d:new Date().toISOString().slice(0,10),
      gname:src.displayName.text};
    localStorage.setItem("fuelradar.gchk",JSON.stringify(gcheck));
    setStatus(t("gdone"),"ok");render();
  }catch(e){setStatus(t("gfail"),"err");}
}
/* ---------- auto Google price check ---------- */
async function autoCheck(){
  const today=new Date().toISOString().slice(0,10);
  const cands=stations.filter(s=>s.prices[fuel]!=null&&(!brand||s.name.toUpperCase()===brand))
    .sort((a,b)=>a.dist-b.dist).slice(0,40)
    .filter(s=>!(gcheck[s.id]&&gcheck[s.id].d===today&&gcheck[s.id].f===fuel));
  if(!cands.length){render();return;}
  const c=gQuota();
  if(c.n+cands.length>100)cands.length=Math.max(0,100-c.n);
  if(!cands.length){render();return;}
  c.n+=cands.length;localStorage.setItem("fuelradar.gcq",JSON.stringify(c));
  setStatus('<span class="spin"></span>'+esc(t("aauto")));
  const want=GTYPES[fuel];
  const is95=want.indexOf("95")>=0,is98=want.indexOf("98")>=0;
  function score(type){
    const u=(type||"").toUpperCase();
    if(u===want)return 3;
    if(is95&&u.indexOf("95")>=0)return 2;
    if(is98&&u.indexOf("98")>=0)return 2;
    if(want==="DIESEL")return u==="DIESEL"?3:(u.indexOf("DIESEL")>=0?1:0);
    if(want==="AUTOGAS")return (u==="LPG"||u==="AUTOGAS")?2:0;
    if(want==="CNG")return (u.indexOf("CNG")>=0||u.indexOf("GNC")>=0)?2:0;
    return 0;
  }
  let found=0,diff=0;
  for(const s of cands){
    const parts=(s.addr||"").split(",").map(x=>x.trim()).filter(Boolean);
    const city=parts.length?parts[parts.length-1]:"";
    let hit=null,src=null;
    try{
      const r=await fetch("https://places.googleapis.com/v1/places:searchText",{method:"POST",
        headers:{"Content-Type":"application/json","X-Goog-Api-Key":GKEY,
          "X-Goog-FieldMask":"places.id,places.displayName,places.fuelOptions"},
        body:JSON.stringify({textQuery:s.name+" "+city,"languageCode":"fr"})});
      const j=await r.json();
      for(const p of (j.places||[]).slice(0,2)){
        for(const f of ((p.fuelOptions||{}).fuelPrices||[])){
          const sc=score(f.type);
          if(sc>(hit?hit._sc:0)){hit=Object.assign({},f,{_sc:sc});src=p;}
        }
      }
    }catch(e){}
    if(hit&&hit._sc>=2){
      found++;
      const val=(+hit.price.units||0)+(+hit.price.nanos||0)/1e9;
      if(Math.abs(val-s.prices[fuel])>0.004)diff++;
      gcheck[s.id]={v:val,ts:hit.updateTime,f:fuel,d:today,gname:src.displayName.text};
    }
  }
  localStorage.setItem("fuelradar.gchk",JSON.stringify(gcheck));
  setStatus(found?subst(t("adone"),{n:found,m:diff}):t("anone"),found?"ok":"");
  render();
}
/* ---------- render ---------- */
function colorize(vals,p){const lo=Math.min(...vals),hi=Math.max(...vals);
  if(hi===lo)return "cheap";const f=(p-lo)/(hi-lo);return f<0.4?"cheap":f>0.75?"dear":"";}
function render(){
  const cons=+$("#cons").value||6.5, fl=+$("#fill").value||40;
  const rows=stations.filter(s=>s.prices[fuel]!=null)
    .filter(s=>!brand||s.name.toUpperCase()===brand)
    .sort((a,b)=>score(a)-score(b));
  const vals=rows.map(r=>r.prices[fuel]);
  const netOf=s=>{const p=s.prices[fuel];const detour=2*roadKm(s)*cons/100*p;return {fill:fl*p,detour,net:fl*p+detour};};
  if(!rows.length){
    $("#pick").hidden=true;
    $("#list").innerHTML=`<div class="empty"><b>${esc(subst(t("empty1"),{fuel:fuelName(fuel),r:radius}))}</b><br>${esc(t("empty2"))}</div>`;
    if(map){markers.forEach(m=>map.removeLayer(m));markers=[];}
    return;
  }
  const b=rows[0],bn=netOf(b);
  const nets=rows.map(s=>netOf(s));
  const minNet=Math.min(...nets.map(n=>n.net));
  const bi=nets.findIndex(n=>n.net===minNet);
  $("#pick").hidden=false;
  $("#pick").innerHTML=`<div><div class="plabel">${esc(t("best"))}</div><div class="pprice">${nf3(b.prices[fuel])}</div><div class="muted" style="font-size:11px">${esc(subst(t("netline"),{net:money(bn.net),fill:fl,det:money(bn.detour)}))}</div></div>
    <div class="pinfo"><div class="pname">${esc(b.name)}</div><div class="paddr">${esc(b.addr)} · ${esc(subst(t("away"),{d:roadKm(b).toFixed(1)}))}</div></div>
    <a class="btn ghost" style="align-self:center" target="_blank" rel="noopener" href="${gmaps(b)}">${esc(t("navigate"))}</a>`;
  $("#list").innerHTML=rows.slice(0,60).map((s,i)=>{
    const n=netOf(s);
    const delta=n.net-minNet;
    const today=new Date().toISOString().slice(0,10);
    const gv=(gcheck[s.id]&&gcheck[s.id].d===today&&gcheck[s.id].f===fuel)?gcheck[s.id]:null;
    const gline=gv?`<span class="gline" title="Google Places · ${esc(new Date(gv.ts).toLocaleString(loc()))}">Google ${nf3(gv.v)} (${gv.v>s.prices[fuel]?"+":""}${((gv.v-s.prices[fuel])*100).toFixed(1)} c)</span>`:"";
    const sav=delta<0.005
      ?`<span class="sav cheap">${esc(t("cheapest_tag"))}</span>`
      :`<span class="sav" title="${esc(t("savtip"))}">+${esc(money(delta))} ${esc(t("perfill"))}</span>`;
    return `<div class="st${i===bi?" best":""}">
      <div class="rank">${i+1}</div>${brandLogo(s.name)}
      <div class="mid"><div class="name">${esc(s.name)}</div><div class="addr">${esc(s.addr)}</div>
        <div class="meta"><span class="d">${esc(subst(t("away"),{d:roadKm(s).toFixed(1)}))}</span>${sav}${gline}</div></div>
      <div class="right"><div class="price ${colorize(vals,s.prices[fuel])}">${nf3(s.prices[fuel])}</div>
        <div class="net" title="${esc(subst(t("nettip"),{f:money(n.fill),d:money(n.detour)}))}">${esc(t("netword"))} ${money(n.net)}</div>
        <a class="go" data-g="${s.id}" role="button" tabindex="0">${esc(gv?t("gverify").replace("✓","↻"):t("gverify"))}</a>
        <a class="go" target="_blank" rel="noopener" href="${gmaps(s)}">${esc(t("maplink"))}</a></div></div>`;}).join("");
  drawMap(rows,vals);
}
function brandLogo(name){
  const key=name.toUpperCase().split(/[,–-]/)[0].trim();
  const slug=BRAND_LOGO[key];
  const big=["Q8","ESSO","SHELL"].includes(key)?" big":"";
  if(!slug)return `<div class="logo-fb${big}">${esc((key||"?").slice(0,3))}</div>`;
  return `<img class="logo-img${big}" src="https://carbu.com//commonImages/brands/${slug}.gif" alt="" loading="lazy" onerror="this.outerHTML='<div class=\'logo-fb big\'>${esc(key.slice(0,3))}</div>'">`;
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function gmaps(s){return `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}`;}

function drawMap(rows,vals){
  initMap();
  markers.forEach(m=>map.removeLayer(m));markers=[];
  rows.forEach((s,i)=>{
    const cls=colorize(vals,s.prices[fuel]);
    const bg=cls==="cheap"?"#2EC4B6":cls==="dear"?"#F2635F":"#FFB627";
    const m=L.marker([s.lat,s.lon],{icon:L.divIcon({className:"",html:`<div class="pin" style="background:${bg}"><b>${i+1}</b></div>`,iconSize:[26,26]})})
      .bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.addr)}<br><span style="font-family:var(--mono);font-size:18px;color:${bg}">${nf3(s.prices[fuel])} €/L</span><br>${roadKm(s).toFixed(1)} km`);
    markers.push(m);m.addTo(map);
  });
  if(rows.length){
    const g=L.latLngBounds(rows.map(s=>[s.lat,s.lon]));g.extend([center.lat,center.lon]);
    map.fitBounds(g.pad(0.18));
  }
}

function initMap(){
  if(map)return;
  map=L.map("map",{attributionControl:true});
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    {attribution:"© OpenStreetMap contributors — tiles © Esri",maxZoom:19}).addTo(map);
  map.setView([50.85,4.35],8);
  L.circleMarker([50.85,4.35],{radius:6,color:"#FFB627",fillColor:"#FFB627",fillOpacity:1,weight:2})
    .bindPopup(esc(t("startpop"))).addTo(map);
}

/* ---------- location ---------- */
function setCenter(lat,lon,label){
  center={lat,lon};localStorage.setItem("fuelradar.loc",JSON.stringify({lat,lon,label}));
  if(label)setStatus(esc(t("here"))+esc(label));
  load();
}
$("#btnGeo").addEventListener("click",()=>{
  if(!navigator.geolocation){setStatus(t("loc_na"),"err");return;}
  setStatus('<span class="spin"></span>'+esc(t("locating")));
  navigator.geolocation.getCurrentPosition(
    p=>setCenter(p.coords.latitude,p.coords.longitude),
    ()=>{setStatus(t("loc_denied"),"err");$("#q").focus();},
    {enableHighAccuracy:true,timeout:12000});
});
async function searchPlace(){
  const q=$("#q").value.trim();if(!q)return;
  setStatus('<span class="spin"></span>'+esc(subst(t("searching"),{q})));
  try{
    const r=await fetch("https://photon.komoot.io/api/?limit=1&q="+encodeURIComponent(q));
    const j=await r.json();
    const f=j.features&&j.features[0];
    if(!f){setStatus(t("notfound"),"err");return;}
    const label=[f.properties.name,f.properties.city,f.properties.country].filter(Boolean).join(", ");
    setCenter(f.geometry.coordinates[1],f.geometry.coordinates[0],label);
  }catch(e){setStatus(t("searchfail"),"err");}
}
$("#btnGo").addEventListener("click",searchPlace);
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter")searchPlace();});

/* ---------- controls ---------- */
function buildChips(){
  $("#fuelChips").innerHTML='<span class="lab">'+esc(t("fuel"))+'</span>'+FUELS.map(id=>
    `<button class="chip" data-f="${id}" aria-pressed="${id===fuel}">${esc(fuelName(id))}</button>`).join("");
  $("#radChips").innerHTML='<span class="lab">'+esc(t("radius"))+'</span>'+[2,5,10,25].map(r=>
    `<button class="chip" data-r="${r}" aria-pressed="${r===radius}">${r} km</button>`).join("");
}
function updateBrands(){
  const sel=$("#brandSel"),prev=brand;
  const brands=[...new Set(stations.map(s=>s.name.toUpperCase()))].sort();
  sel.innerHTML=`<option value="">${esc(t("allbrands"))} (${stations.length})</option>`+
    brands.map(b=>`<option value="${esc(b)}"${b===prev?" selected":""}>${esc(b)}</option>`).join("");
}
function applyStatic(){
  document.title=t("title");document.documentElement.lang=lang;
  $("#tag").textContent=t("tag");
  $("#btnGeo").textContent=t("locate");
  $("#btnGo").textContent=t("search");
  const q=$("#q");q.placeholder=t("ph");q.setAttribute("aria-label",t("qaria"));
  $("#sortBy").innerHTML=`<option value="smart"${sortBy==="smart"?" selected":""}>${esc(t("smart"))}</option>
    <option value="price"${sortBy==="price"?" selected":""}>${esc(t("cheap"))}</option>
    <option value="dist"${sortBy==="dist"?" selected":""}>${esc(t("near"))}</option>`;
  $("#brandRow").innerHTML='<span class="lab">'+esc(t("brand"))+'</span><select id="brandSel" aria-label="'+esc(t("brand"))+'"><option value=""></option></select>';
  updateBrands();
  $("#netnote").textContent=t("netnote");$("#netnote").title=t("nettip").replace("{f}","…").replace("{d}","…");
  $("#f1").innerHTML=t("f1");$("#f2").textContent=t("f2");
  $("#installHint").textContent=/iphone|ipad/i.test(navigator.userAgent)?t("ios"):/android/i.test(navigator.userAgent)?t("android"):t("desk");
  document.querySelectorAll(".lchip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.l===lang?"true":"false"));
  buildChips();
}
document.addEventListener("change",e=>{
  if(e.target.id==="brandSel"){brand=e.target.value;render();}
  if(e.target.id==="sortBy"){sortBy=e.target.value;render();}
});
document.addEventListener("click",e=>{
  const f=e.target.closest("#fuelChips .chip"),r=e.target.closest("#radChips .chip"),l=e.target.closest(".lchip");
  if(f){fuel=f.dataset.f;buildChips();render();}
  if(r){radius=+r.dataset.r;buildChips();load();}
  const gbtn=e.target.closest("[data-g]");
  if(gbtn){const st=stations.find(x=>String(x.id)===gbtn.dataset.g);if(st)gVerify(st);return;}
  if(l){lang=l.dataset.l;localStorage.setItem("fuelradar.lang",lang);applyStatic();render();
    setStatus(esc(t("initial")));}
});
["cons","fill"].forEach(id=>$("#"+id).addEventListener("input",render));

/* ---------- service worker (offline shell) ---------- */
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

/* ---------- boot ---------- */
initMap();applyStatic();
const locSt=JSON.parse(localStorage.getItem("fuelradar.loc")||"null");
const cache=JSON.parse(localStorage.getItem("fuelradar.cache")||"null");
if(cache&&cache.stations){stations=cache.stations;center=cache.center||locSt;
  updateBrands();
  setStatus(subst(t("cached"),{n:stations.length,date:new Date(cache.ts).toLocaleString(loc())}));
  render();}
if(locSt)setCenter(locSt.lat,locSt.lon,locSt.label);
else setStatus(esc(t("initial")));
</script>
